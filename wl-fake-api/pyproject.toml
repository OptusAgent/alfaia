[project]
name = "wl-fake-api"
version = "0.1.0"
description = "ERP fake da WebLocação (PRD §7.2) para exercitar WL_MODO=real do worker ALFAIA. Dado sintético — não é integração real."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
