[project]
name = "alfaia-worker"
version = "0.1.0"
description = "ALFAIA Background Worker Engine & Messaging Adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # HTTP Client (UAZAPI, WebLocacao, OpenRouter, OpenAI)
    "httpx>=0.27.0",
    # Data validation
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
